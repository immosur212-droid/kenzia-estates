<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | Kenzia Estates</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&family=Playfair+Display:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <style>
        .auth-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, var(--bleu-nuit) 0%, #2d2d44 100%);
            padding: 20px;
        }

        .auth-container {
            background: var(--white);
            padding: 50px;
            border-radius: 5px;
            box-shadow: var(--shadow-xl);
            max-width: 450px;
            width: 100%;
        }

        .auth-logo {
            text-align: center;
            margin-bottom: 30px;
        }

        .auth-logo img {
            height: 50px;
            margin-bottom: 15px;
        }

        .auth-logo h2 {
            font-size: 1.8rem;
            color: var(--bleu-nuit);
            margin-bottom: 10px;
        }

        .auth-logo p {
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        .auth-form .form-group {
            margin-bottom: 20px;
        }

        .auth-form label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: var(--bleu-nuit);
            font-size: 0.9rem;
        }

        .auth-form .form-control {
            width: 100%;
            padding: 14px;
            border: 2px solid var(--border-light);
            font-family: var(--font-sans);
            font-size: 0.95rem;
            transition: var(--transition-fast);
        }

        .auth-form .form-control:focus {
            outline: none;
            border-color: var(--matte-brass);
        }

        .auth-form .btn-primary {
            width: 100%;
            padding: 16px;
            font-size: 1rem;
            margin-top: 10px;
        }

        .auth-footer {
            text-align: center;
            margin-top: 25px;
            padding-top: 25px;
            border-top: 1px solid var(--border-light);
        }

        .auth-footer p {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-bottom: 10px;
        }

        .auth-footer a {
            color: var(--matte-brass);
            font-weight: 600;
        }

        .auth-footer a:hover {
            text-decoration: underline;
        }

        .error-message {
            background: rgba(231, 76, 60, 0.1);
            color: var(--error);
            padding: 12px;
            border-radius: 5px;
            margin-bottom: 20px;
            font-size: 0.9rem;
            display: none;
        }

        .error-message.show {
            display: block;
        }

        .success-message {
            background: rgba(39, 174, 96, 0.1);
            color: var(--success);
            padding: 12px;
            border-radius: 5px;
            margin-bottom: 20px;
            font-size: 0.9rem;
            display: none;
        }

        .success-message.show {
            display: block;
        }
    </style>
</head>
<body>
    <div class="auth-page">
        <div class="auth-container">
            <div class="auth-logo">
                <img src="images/logo.png" alt="Kenzia Estates">
                <h2>Create Account</h2>
                <p>Join Kenzia Estates today</p>
            </div>

            <<!-- Message d'erreur -->
<div class="error-message" id="errorMessage" style="display: none;">
    <i class="fas fa-exclamation-circle"></i>
    <span id="errorText"></span>
</div>

<!-- Message de succès -->
<div class="success-message" id="successMessage" style="display: none;">
    <i class="fas fa-check-circle"></i>
    <span id="successText"></span>
</div>

            <form class="auth-form" id="registerForm">
                <div class="form-group">
                    <label for="fullName">Full Name</label>
                    <input type="text" id="fullName" class="form-control" placeholder="John Doe" required>
                </div>

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" class="form-control" placeholder="your@email.com" required>
                </div>

                <div class="form-group">
                    <label for="phone">Phone Number</label>
                    <input type="tel" id="phone" class="form-control" placeholder="+212 6XX XXX XXX" required>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" class="form-control" placeholder="Min 6 characters" required minlength="6">
                </div>

                <div class="form-group">
                    <label for="confirmPassword">Confirm Password</label>
                    <input type="password" id="confirmPassword" class="form-control" placeholder="••••••••" required>
                </div>

               <button type="submit" class="btn btn-primary" id="submitBtn">
        <span id="btnText">Create Account</span>
        <i class="fas fa-arrow-right" id="btnIcon"></i>
    </button>
            </form>

            <div class="auth-footer">
                <p>Already have an account? <a href="login.html">Sign In</a></p>
                <p><a href="index.html">← Back to Home</a></p>
            </div>
        </div>
    </div>

  <script>
    // ============================================
    // CONFIGURATION
    // ============================================
    const API_URL = window.location.origin + '/api';

    // ============================================
    // ÉLÉMENTS DU DOM
    // ============================================
    const registerForm = document.getElementById('registerForm');
    const submitBtn = document.getElementById('submitBtn');
    const btnText = document.getElementById('btnText');
    const btnIcon = document.getElementById('btnIcon');
    const errorDiv = document.getElementById('errorMessage');
    const successDiv = document.getElementById('successMessage');

    // ============================================
    // GESTION DE L'INSCRIPTION
    // ============================================
    if (registerForm) {
        registerForm.addEventListener('submit', async (e) => {
            e.preventDefault(); // Empêche le rechargement de la page
            
            // Cacher les anciens messages
            hideMessages();
            
            // Récupérer les valeurs
            const fullName = document.getElementById('fullName').value.trim();
            const email = document.getElementById('email').value.trim();
            const phone = document.getElementById('phone').value.trim();
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            
            // Validation côté client
            if (!fullName || !email || !password) {
                showError('Veuillez remplir tous les champs obligatoires.');
                return;
            }
            
            if (password !== confirmPassword) {
                showError('Les mots de passe ne correspondent pas.');
                return;
            }
            
            if (password.length < 6) {
                showError('Le mot de passe doit contenir au moins 6 caractères.');
                return;
            }
            
            // Afficher l'état de chargement
            setLoading(true);
            
            try {
                const response = await fetch(`${API_URL}/users/register`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        full_name: fullName,
                        email: email,
                        phone: phone || null,
                        password: password
                    })
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    // ✅ SUCCÈS
                    showSuccess('Compte créé avec succès ! Redirection vers la connexion...');
                     // IMPORTANT : Déconnecter l'utilisateur actuel
                        localStorage.removeItem('token');
                        localStorage.removeItem('user');
                    // Rediriger vers la page de login après 2 secondes
                    setTimeout(() => {
                        window.location.href = 'login.html';
                    }, 2000);
                    
                } else {
                    // ❌ ERREUR VENANT DU BACKEND (ex: Email déjà utilisé)
                    showError(data.error || 'L\'inscription a échoué.');
                    setLoading(false);
                }
                
            } catch (error) {
                // ❌ ERREUR RÉSEAU
                console.error('Erreur réseau:', error);
                showError('Impossible de se connecter au serveur. Vérifiez qu\'il est démarré.');
                setLoading(false);
            }
        });
    }

    // ============================================
    // FONCTIONS UTILITAIRES
    // ============================================
    function showError(message) {
        if (errorDiv) {
            document.getElementById('errorText').textContent = message;
            errorDiv.style.display = 'flex'; // ou errorDiv.classList.add('show') selon votre CSS
        } else {
            alert(message);
        }
    }

    function showSuccess(message) {
        if (successDiv) {
            document.getElementById('successText').textContent = message;
            successDiv.style.display = 'flex'; // ou successDiv.classList.add('show')
        } else {
            alert(message);
        }
    }

    function hideMessages() {
        if (errorDiv) errorDiv.style.display = 'none';
        if (successDiv) successDiv.style.display = 'none';
    }

    function setLoading(isLoading) {
        if (submitBtn) submitBtn.disabled = isLoading;
        if (btnText) btnText.textContent = isLoading ? 'Création en cours...' : 'Create Account';
        if (btnIcon) btnIcon.className = isLoading ? 'fas fa-spinner fa-spin' : 'fas fa-arrow-right';
    }
</script>
</body>
</html>
